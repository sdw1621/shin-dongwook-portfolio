<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포트폴리오</title>
    <meta name="description" content="개인 포트폴리오">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: {
                fontFamily: { sans: ['Pretendard', 'Inter', 'system-ui', 'sans-serif'] },
                colors: { brand: { DEFAULT: '#2563eb', dark: '#1428a0' } }
            } }
        }
    </script>
    <style> html { -webkit-font-smoothing: antialiased; } </style>
</head>
<body class="font-sans bg-gray-50 text-gray-900 min-h-screen">
    <div id="loading" class="min-h-screen flex items-center justify-center text-gray-400 text-sm">불러오는 중…</div>

    <div id="notfound" class="hidden min-h-screen flex flex-col items-center justify-center px-6 text-center">
        <span class="text-5xl mb-4">🔍</span>
        <h1 class="text-xl font-bold mb-2">포트폴리오를 찾을 수 없습니다</h1>
        <p id="notfoundMsg" class="text-sm text-gray-500">주소가 올바른지 확인해 주세요.</p>
    </div>

    <main id="content" class="hidden max-w-4xl mx-auto px-5 py-14">
        <!-- 헤더 (소개) -->
        <header class="text-center mb-14">
            <div id="avatar" class="w-24 h-24 mx-auto mb-6 rounded-full bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center text-white text-3xl font-extrabold shadow-lg"></div>
            <h1 id="name" class="text-3xl sm:text-4xl font-extrabold tracking-tight"></h1>
            <p id="headline" class="mt-3 text-lg text-brand font-semibold"></p>
            <p id="bio" class="mt-5 max-w-2xl mx-auto text-gray-600 leading-relaxed whitespace-pre-line"></p>
        </header>

        <!-- 스킬 -->
        <section id="skillsSec" class="hidden mb-14">
            <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider text-center mb-5">전문 분야</h2>
            <div id="skills" class="flex flex-wrap justify-center gap-2.5"></div>
        </section>

        <!-- 이력 -->
        <section id="expSec" class="hidden">
            <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider text-center mb-6">주요 이력</h2>
            <div id="expList" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </section>

        <footer class="mt-20 pt-8 border-t border-gray-100 text-center text-xs text-gray-400">
            <span id="footName"></span> · Portfolio
        </footer>
    </main>

    <script src="portfolio.js"></script>
</body>
</html>
