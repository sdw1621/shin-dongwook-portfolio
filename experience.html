    <style>
        html { -webkit-font-smoothing: antialiased; }
        body { font-family: 'Pretendard', 'Inter', sans-serif; }

        /* 부드러운 등장 애니메이션 */
        .reveal { opacity: 0; transform: translateY(28px); transition: opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1); }
        .exp-hide { display: none !important; }
        .reveal.show { opacity: 1; transform: none; }

        /* 그라데이션 텍스트 */
        .grad-text { background: linear-gradient(120deg,#2563eb 0%,#4f46e5 50%,#7c3aed 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

        /* 히어로 배경 블롭 */
        .blob { position:absolute; border-radius:9999px; filter: blur(64px); opacity:.45; z-index:0; animation: float 14s ease-in-out infinite; }
        @keyframes float { 0%,100%{ transform: translate(0,0) scale(1);} 50%{ transform: translate(20px,-24px) scale(1.08);} }

        /* 프로필 사진 글로우 링 */
        .photo-ring { background: conic-gradient(from 140deg,#2563eb,#7c3aed,#06b6d4,#2563eb); }

        /* 로고 월 타일 */
        .logo-tile { display:flex; align-items:center; justify-content:center; height:84px; padding:16px 18px; background:#fff; border:1px solid #eef0f2; border-radius:16px; transition: box-shadow .3s ease, transform .3s ease, border-color .3s ease; }
        .logo-tile img { max-height:34px; max-width:82%; object-fit:contain; filter: grayscale(1); opacity:.85; transition: filter .3s ease, opacity .3s ease; }
        .logo-tile:hover { box-shadow:0 14px 32px -14px rgba(15,23,42,.18); transform: translateY(-3px); border-color:#e2e8f0; }

    (async function(){

        var prof=null; try{ var pr=await sb.from('profile').select('*').limit(1); if(!pr.error && pr.data && pr.data.length) prof=pr.data[0]; }catch(_pe){}
        var esc = function(s){ return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };

        var normalizePeriod = function(period){
            if(!period) return "";
            var s=String(period).trim(); if(!s) return "";
            var pad=function(n){return String(n).padStart(2,'0');};

            var parseToken=function(tok){
                tok=(tok||"").trim(); if(!tok) return null;
                var time="", tm=tok.match(/(\d{1,2}):(\d{2})/);
                if(tm){ time=pad(tm[1])+":"+tm[2]; tok=tok.replace(tm[0],"").trim(); }
                var m;
                if((m=tok.match(/(\d{4})[.\-](\d{1,2})(?:[.\-](\d{1,2}))?/))){ ctxY=m[1]; ctxM=pad(m[2]); return {y:m[1],mo:pad(m[2]),d:m[3]?pad(m[3]):"",t:time}; }

                return null;
            };

                var parts=g.split("~").map(function(x){return x.trim();});

                var fmtDate=function(o){return o.y+"."+o.mo+"."+(o.d||"01");};

        var CAT_COLOR={'대기업·금융':'from-slate-700 to-slate-900','정부·공공기관':'from-blue-600 to-indigo-700','대학·교육':'from-violet-500 to-purple-600','기타':'from-teal-500 to-cyan-600'};

        var keypointBadge = function(org, explicit){

            s=s.replace(/^(주식회사|유한회사|사단법인|재단법인|학교법인|의료법인|사회복지법인|협동조합|비영리법인)\s*/,'').trim();

        // 날짜 내림차순 정렬 키 (period → YYYYMMDD 숫자)
        // 정렬 키: normalizePeriod로 정규화(230727→2023.07.27) 후 시작일 YYYYMMDD 추출 — 압축표기 오정렬 방지

            var curRows=function(){ var q=((si&&si.value)||'').trim().toLowerCase(), y=(ysel&&ysel.value)||'';
                return sorted.filter(function(r){ var s=((r.org||'')+' '+(r.title||'')+' '+(r.description||'')).toLowerCase(); return (!q||s.indexOf(q)>=0)&&(!y||yearsOf(r.period).indexOf(parseInt(y,10))>=0); }); };
            // 만 나이(대한민국) 계산
            var ageOf=function(birth){ if(!birth) return ''; var b=new Date(birth); if(isNaN(b.getTime())) return ''; var t=new Date(); var a=t.getFullYear()-b.getFullYear(); if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate())) a--; return a; };
            var birthFmt=function(birth){ if(!birth) return ''; var b=new Date(birth); if(isNaN(b.getTime())) return String(birth); var p=function(n){return String(n).padStart(2,'0');}; return b.getFullYear()+'.'+p(b.getMonth()+1)+'.'+p(b.getDate()); };
            // 이름 표기(한글 (영문 / 한자))
            var nameLine=function(p){ if(!p) return ''; var sub=[p.name_en,p.name_hanja].filter(Boolean).join(' / '); return (p.name_ko||'')+(sub?' ('+sub+')':''); };
            // 기본정보 → [라벨, 값] 목록
            var profRows=function(p){ if(!p) return []; var age=ageOf(p.birth); var bf=birthFmt(p.birth); var out=[];
                if(nameLine(p)) out.push(['이름', nameLine(p)]);
                if(bf) out.push(['생년월일', bf+(age!==''?' (만 '+age+'세)':'')]);
                if(p.phone) out.push(['휴대전화', p.phone]);
                if(p.email) out.push(['이메일', p.email]);
                if(p.address) out.push(['주소', p.address]);
                if(p.job_target) out.push(['희망직무', p.job_target]);
                return out; };
            // 현재 적용된 필터 설명 (다운로드에 '누락'처럼 보이지 않도록 명시)
            var filterDesc=function(){ var fq=((si&&si.value)||'').trim(), fy=((ysel&&ysel.value)||''); var parts=[]; if(fy) parts.push('연도 '+fy+'년'); if(fq) parts.push('검색 "'+fq+'"'); return parts.length?parts.join(' · '):'전체'; };
            var xb=document.getElementById('exp-xlsx');
            if(xb) xb.onclick=function(){
                var pr=profRows(prof);
                var cr=curRows();
                // 진짜 Excel(.xlsx) — 영역별 시트로 분리 저장 (기본정보 + 학력/경력/강의·출강/프로젝트·연구/교육이수)
                if(window.XLSX){
                    var wb=XLSX.utils.book_new();
                    var info=[];
                    if(pr.length){ info.push(['이력서']); pr.forEach(function(kv){ info.push(kv); }); }
                    info.push(['조회조건', filterDesc()+' · 총 '+cr.length+'건']);
                    var wi=XLSX.utils.aoa_to_sheet(info); wi['!cols']=[{wch:12},{wch:60}];
                    XLSX.utils.book_append_sheet(wb, wi, '기본정보');
                    ORDER.forEach(function(k){ var it=cr.filter(function(r){return (r.kind||'lecture')===k;}); if(!it.length) return;
                        var aoa=[['기간','기관/회사','과정/직위','설명']];
                        it.forEach(function(r){ aoa.push([r.period||'',r.org||'',r.title||'',r.description||'']); });
                        var ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:26},{wch:24},{wch:24},{wch:52}];
                        XLSX.utils.book_append_sheet(wb, ws, KL[k]||k);
                    });
                    XLSX.writeFile(wb, '신동욱_이력.xlsx');
                    return;
                }
                // XLSX 로드 실패 시에만 CSV로 폴백 (단일 시트)
                var lines=[];
                if(pr.length){ lines.push(['이력서']); pr.forEach(function(kv){ lines.push(kv); }); }
                lines.push(['조회조건', filterDesc()+' · 총 '+cr.length+'건']); lines.push([]);
                lines.push(['구분','기관/회사','과정/직위','기간','설명']);
                cr.forEach(function(r){ lines.push([KL[r.kind||'lecture']||'강의',r.org||'',r.title||'',r.period||'',r.description||'']); });
                var csv=lines.map(function(row){ return row.map(function(c){ return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'; }).join(','); }).join('\r\n');
                var blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
                var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='신동욱_이력.csv'; document.body.appendChild(a); a.click(); a.remove(); };
            var pb=document.getElementById('exp-pdf');
            if(pb) pb.onclick=function(){
                var e2=function(s){ return (s||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); };
                var sec='';
                var cur=curRows();
                ORDER.forEach(function(k){ var it=cur.filter(function(r){return (r.kind||'lecture')===k;}); if(!it.length) return;
                    sec+='<h2>'+KL[k]+'</h2><table><thead><tr><th>기간</th><th>기관/회사</th><th>과정/직위</th><th>설명</th></tr></thead><tbody>';
                    it.forEach(function(r){ sec+='<tr><td>'+e2(r.period)+'</td><td>'+e2(r.org)+'</td><td>'+e2(r.title)+'</td><td>'+e2(r.description)+'</td></tr>'; });
                    sec+='</tbody></table>'; });
                // 상단 기본정보 카드(사진 + 인적사항)
                var hdr='';
                var pr=profRows(prof);
                if(pr.length || (prof&&prof.photo_url)){
                    var photo=(prof&&prof.photo_url)?'<td class="ph"><img src="'+e2(prof.photo_url)+'" alt="사진"></td>':'<td class="ph"><div class="nophoto">사진</div></td>';
                    var info=pr.map(function(kv){ return '<tr><th>'+e2(kv[0])+'</th><td>'+e2(kv[1])+'</td></tr>'; }).join('');
                    hdr='<table class="profile"><tr>'+photo+'<td class="info"><table class="pinfo">'+info+'</table></td></tr></table>';
                }
                var w=window.open('','_blank'); if(!w){ alert('팝업이 차단되었습니다. 팝업을 허용해 주세요.'); return; }
                w.document.write('<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>신동욱 이력서</title><style>body{font-family:Pretendard,system-ui,sans-serif;color:#111;padding:32px}h1{font-size:22px;margin:0 0 4px}p.sub{color:#666;margin:0 0 16px;font-size:13px}h2{font-size:15px;margin:22px 0 8px;color:#2563eb;border-bottom:2px solid #2563eb;padding-bottom:4px}table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px}th,td{border:1px solid #e5e7eb;padding:6px 8px;text-align:left;vertical-align:top}th{background:#f8fafc;font-weight:700}table.profile{margin:0 0 20px}table.profile>tbody>tr>td{border:1px solid #d1d5db;padding:0}td.ph{width:120px;text-align:center;vertical-align:middle;background:#fff;padding:8px}td.ph img{width:100px;height:130px;object-fit:cover;border:1px solid #d1d5db}td.ph .nophoto{width:100px;height:130px;display:flex;align-items:center;justify-content:center;color:#9ca3af;border:1px dashed #d1d5db;margin:0 auto;font-size:12px}td.info{padding:0}table.pinfo{margin:0}table.pinfo th{width:90px;white-space:nowrap}@media print{body{padding:0}}</style></head><body><h1>신동욱 이력서</h1><p class="sub">AI인터시스 대표이사 · 생성형 AI · 데이터 · 프로그래밍 교육<br>조회조건: '+e2(filterDesc())+' · 총 '+cur.length+'건</p>'+hdr+sec+'<scr'+'ipt>window.onload=function(){setTimeout(function(){window.print();},300);}</scr'+'ipt></body></html>');
                w.document.close(); };
        })();
        // (탭 전환은 아래 독립 블록에서 처리 — 데이터 로드와 무관)
        var ex = document.getElementById('exp-extra');
        if(ex){
            var CUR=(new Date()).getFullYear();
            var yrOf=function(r){ var m=(r.period||'').match(/\d{4}/); var y=m?parseInt(m[0]):0; return (y>CUR+1)?0:y; };
            var PREVIEW=5, OPEN_YEARS=2;
            var groups={}; extra.forEach(function(r){ var y=yrOf(r)||'기타'; (groups[y]=groups[y]||[]).push(r); });
            var years=Object.keys(groups).sort(function(a,b){ var av=(a==='기타'?-1:a*1), bv=(b==='기타'?-1:b*1); return bv-av; });
            var oldEl=document.getElementById('exp-older'); if(oldEl){ oldEl.remove(); }
            var html='';
            years.forEach(function(y, yi){
                var items=groups[y], open=(yi<OPEN_YEARS), label=(y==='기타'?'기타':y+'년');
                var cells=items.map(function(r,i){ return '<div class="exp-card '+(i>=PREVIEW?'more-item hidden ':'')+'"'+fdata(r)+'>'+card(r)+'</div>'; }).join('');
                var moreN=items.length-PREVIEW;
                html+='<div class="year-sec">'
                  +'<button type="button" class="year-toggle w-full flex items-center gap-2 mb-4 text-left">'
                    +'<span class="text-sm font-extrabold text-gray-700">'+label+'</span>'
                    +'<span class="text-xs font-bold text-gray-300">('+items.length+')</span>'
                    +'<span class="year-arrow text-gray-400 transition-transform duration-200 '+(open?'rotate-180':'')+'">▾</span>'
                    +'<span class="flex-1 border-t border-gray-100 ml-2"></span>'
                  +'</button>'
                  +'<div class="year-body '+(open?'':'hidden')+'">'
                    +'<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 items-stretch">'+cells+'</div>'
                    +(moreN>0?'<button type="button" class="more-btn mt-4 inline-flex items-center gap-2 px-5 py-2.5 rounded-full border border-gray-200 text-sm font-semibold text-gray-600 hover:bg-gray-50 transition">＋ '+moreN+'개 더 보기</button>':'')
                  +'</div>'
                +'</div>';
            });
            ex.className='space-y-8';
            ex.innerHTML=html;
            ex.querySelectorAll('.year-toggle').forEach(function(btn){
                btn.onclick=function(){ var body=btn.nextElementSibling, arrow=btn.querySelector('.year-arrow'); body.classList.toggle('hidden'); var open=!body.classList.contains('hidden'); if(arrow){ arrow.classList.toggle('rotate-180', open); } };
            });
            ex.querySelectorAll('.more-btn').forEach(function(btn){
                btn.onclick=function(){ var body=btn.parentNode, hid=body.querySelectorAll('.more-item.hidden'); if(hid.length){ body.querySelectorAll('.more-item').forEach(function(el){ el.classList.remove('hidden'); }); btn.textContent='− 접기'; } else { var all=body.querySelectorAll('.more-item'); all.forEach(function(el){ el.classList.add('hidden'); }); btn.textContent='＋ '+all.length+'개 더 보기'; } };
            });
        }
      }catch(e){ /* 오류 시 정적 콘텐츠 유지 */ }
    })();
    </script>
